<?xml version="1.0" encoding="UTF-8"?>
<svg width="720" height="1280" viewBox="0 0 720 1280" xmlns="http://www.w3.org/2000/svg">
  <!-- Stickers theme wallpaper: a cheerful sheet of cute green dinos and
       polka dots on white, in the spirit of a kids' sticker book. Kept soft
       and low-contrast so page text stays easy to read over the app's wash. -->
  <defs>
    <!-- One kawaii dino sticker: rounded body, tiny legs, little back spikes,
         a happy face and a soft outline like a die-cut sticker. -->
    <g id="dino">
      <!-- white sticker halo -->
      <path d="M20 78 q-14 0 -14 -16 q0 -30 22 -44 q6 -26 34 -26 q30 0 40 22 q26 2 26 26 q0 20 -18 24 l0 14 q0 6 -6 6 l-8 0 q-6 0 -6 -6 l0 -6 l-26 0 l0 6 q0 6 -6 6 l-8 0 q-6 0 -6 -6 z"
            fill="#ffffff" stroke="#ffffff" stroke-width="10" stroke-linejoin="round"/>
      <!-- back spikes -->
      <path d="M40 18 l7 -12 l7 12 z M54 12 l7 -12 l7 12 z M68 16 l7 -12 l7 12 z" fill="#8ED081"/>
      <!-- body -->
      <path d="M24 74 q-12 0 -12 -14 q0 -26 20 -38 q6 -22 30 -22 q26 0 34 20 q22 2 22 22 q0 18 -18 20 l0 12 q0 4 -4 4 l-8 0 q-4 0 -4 -4 l0 -6 l-26 0 l0 6 q0 4 -4 4 l-8 0 q-4 0 -4 -4 z"
            fill="#A6E29B" stroke="#7FBF74" stroke-width="3" stroke-linejoin="round"/>
      <!-- tummy -->
      <ellipse cx="58" cy="54" rx="20" ry="14" fill="#EAF7E4"/>
      <!-- eyes + smile -->
      <circle cx="70" cy="34" r="3.4" fill="#3B5B39"/>
      <circle cx="86" cy="34" r="3.4" fill="#3B5B39"/>
      <path d="M70 42 q8 7 16 0" fill="none" stroke="#3B5B39" stroke-width="2.4" stroke-linecap="round"/>
      <!-- cheek -->
      <circle cx="64" cy="41" r="3" fill="#F6B8B0" opacity="0.7"/>
    </g>

    <g id="dot"><circle r="7" fill="#D8EED0"/></g>
    <g id="dotb"><circle r="10" fill="#EAF3FB"/></g>
  </defs>

  <rect width="720" height="1280" fill="#FFFFFF"/>

  <!-- polka dots scattered on a loose grid -->
  <use href="#dot" x="70" y="60"/>
  <use href="#dotb" x="360" y="40"/>
  <use href="#dot" x="640" y="90"/>
  <use href="#dot" x="200" y="150"/>
  <use href="#dotb" x="520" y="180"/>
  <use href="#dot" x="90" y="300"/>
  <use href="#dotb" x="300" y="330"/>
  <use href="#dot" x="600" y="320"/>
  <use href="#dot" x="440" y="430"/>
  <use href="#dotb" x="140" y="470"/>
  <use href="#dot" x="660" y="520"/>
  <use href="#dot" x="250" y="560"/>
  <use href="#dotb" x="500" y="620"/>
  <use href="#dot" x="80" y="660"/>
  <use href="#dot" x="360" y="720"/>
  <use href="#dotb" x="620" y="740"/>
  <use href="#dot" x="180" y="800"/>
  <use href="#dot" x="470" y="850"/>
  <use href="#dotb" x="90" y="900"/>
  <use href="#dot" x="640" y="930"/>
  <use href="#dot" x="300" y="960"/>
  <use href="#dotb" x="520" y="1020"/>
  <use href="#dot" x="120" y="1060"/>
  <use href="#dot" x="400" y="1110"/>
  <use href="#dotb" x="640" y="1140"/>
  <use href="#dot" x="220" y="1180"/>
  <use href="#dot" x="500" y="1220"/>

  <!-- dinos, gently rotated and scaled, spread down the sheet -->
  <use href="#dino" transform="translate(40 120) scale(1.05)"/>
  <use href="#dino" transform="translate(440 200) rotate(8) scale(0.95)"/>
  <use href="#dino" transform="translate(250 260) rotate(-6) scale(1.1)"/>
  <use href="#dino" transform="translate(520 360) rotate(4) scale(0.9)"/>
  <use href="#dino" transform="translate(90 430) rotate(-4) scale(1.0)"/>
  <use href="#dino" transform="translate(360 500) rotate(10) scale(1.05)"/>
  <use href="#dino" transform="translate(560 560) rotate(-8) scale(0.92)"/>
  <use href="#dino" transform="translate(150 620) rotate(6) scale(1.08)"/>
  <use href="#dino" transform="translate(420 700) rotate(-5) scale(0.98)"/>
  <use href="#dino" transform="translate(60 760) rotate(7) scale(1.02)"/>
  <use href="#dino" transform="translate(300 820) rotate(-9) scale(1.1)"/>
  <use href="#dino" transform="translate(540 880) rotate(5) scale(0.9)"/>
  <use href="#dino" transform="translate(140 940) rotate(-6) scale(1.0)"/>
  <use href="#dino" transform="translate(420 1000) rotate(9) scale(1.05)"/>
  <use href="#dino" transform="translate(70 1060) rotate(-4) scale(0.96)"/>
  <use href="#dino" transform="translate(320 1120) rotate(6) scale(1.08)"/>
  <use href="#dino" transform="translate(540 1180) rotate(-7) scale(0.94)"/>
</svg>
